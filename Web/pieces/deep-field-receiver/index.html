<!DOCTYPE html>
<html lang="en" data-home="tc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Deep Field Receiver</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<script src="../../pieces.js"></script>
<script src="../../shared/host.js"></script>
<style>
/* VOICE: patient, scientific, listening to the far dark
   IDEA: a radio telescope's spectrogram — each voice is a signal line in the waterfall, its harmonics fainter lines beside it
   PICTURE: live spectrum trace on top, heat-coloured waterfall scrolling down beneath, chord arrivals annotated in the margin
   COLOUR and TYPE: three colour maps (inferno, ice, chart paper); Martian Mono for every readout
   LAYOUT: header strip, spectrum, frequency axis, waterfall to the bottom with readouts over its lower corners */
:root{--ink:#ffd9a8;--bg:#05030a;--bar:rgba(10,6,18,.88);--line:rgba(255,217,168,.28)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:13px/1.4 "Martian Mono",ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 10px;transition:opacity 1.4s ease;pointer-events:none}
body.idle #ui{opacity:0}body.idle{cursor:none}
#bar{pointer-events:auto;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:2px 6px;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{font:inherit;color:inherit;background:none;border:0;min-height:44px;min-width:44px;padding:0 10px;border-radius:5px;cursor:pointer;font-size:12px}
button:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#play{display:grid;place-items:center;padding:0}#play svg{width:16px;height:16px;fill:currentColor}
.seg{display:flex;align-items:center}.seg button{opacity:.5;padding:0 8px}.seg button[aria-pressed=true]{opacity:1;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
label.vol{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;padding:0 6px}
input[type=range]{width:86px;height:44px;accent-color:var(--ink)}
#start{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 72%,transparent);transition:opacity 1.4s ease}
#start.gone{opacity:0;pointer-events:none}
#card{max-width:470px}
#card .k{font-size:11px;opacity:.6;letter-spacing:.06em;margin:0 0 10px}
#card h1{font:300 clamp(30px,7.2vw,46px)/1.05 "Martian Mono",monospace;margin:0 0 16px;letter-spacing:-.02em}
#card p{margin:0 0 24px;font-size:14px;opacity:.85;line-height:1.65}
#go{border:1px solid var(--ink);padding:0 22px;min-height:48px;font-size:13px}
#card .meta{font-size:11px;opacity:.55;margin-top:14px}
#msg{position:fixed;left:12px;right:12px;top:12px;background:#5a1d14;color:#fff;font:14px system-ui,sans-serif;padding:8px 12px;border-radius:6px;z-index:6}
#msg[hidden]{display:none}
@media(max-width:620px){input[type=range]{width:60px}.seg button{padding:0 6px;font-size:11px}.sep{display:none}}
@media(prefers-reduced-motion:reduce){#ui,#start{transition:none}}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html.in-app #fs{display:none!important}
html{--ss-top:36px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"><div id="bar">
  <button id="play" aria-label="Pause"><svg viewBox="0 0 20 20" id="ico"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
  <button id="fresh">New target</button>
  <span class="sep"></span>
  <div class="seg" role="group" aria-label="Signals" id="count"><button data-n="4" aria-pressed="false">4</button><button data-n="5" aria-pressed="true">5</button><button data-n="6" aria-pressed="false">6</button></div>
  <span class="sep"></span>
  <div class="seg" role="group" aria-label="Pace" id="pace"><button data-p="0.65" aria-pressed="false">Fast</button><button data-p="1" aria-pressed="true">Normal</button><button data-p="1.5" aria-pressed="false">Slow</button></div>
  <label class="vol">Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
</div></div>
<div id="msg" hidden></div>
<div id="start"><div id="card">
  <div class="k">RADIO OBSERVATORY · NIGHT RUN</div>
  <h1>Deep Field Receiver</h1>
  <p>Each voice arrives as a signal from deep space: a bright line in the waterfall, its harmonics fainter lines beside it. When the chord clashes the band fills with interference; when it resolves the signals lock clean.</p>
  <button id="go">Open the receiver</button>
  <div class="meta">Best with headphones</div>
</div></div>
<script>
{
/* ===== gliding-voice engine: shared by Star Trails and Ground Tracks ===== */
const NOTE=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const HARM={
  serene:{q:[['maj9',[4,7,11,14],3],['6/9',[4,9,14,7],2],['maj7♯11',[4,11,14,18],1.4],['9sus4',[5,7,10,14],1.4],['m9',[3,7,10,14],1]],
    mv:[[5,3],[-5,2.4],[-4,2],[2,1.5],[-2,1.5],[4,1],[3,.8]],hold:[7,11],glide:[1.6,3.2],stag:[.5,1.3],sus:.45},
  dream:{q:[['maj7♯11',[4,11,14,18],3],['maj9',[4,7,11,14],2],['9sus4',[5,7,10,14],2],['6/9',[4,9,14,7],1.5],['m9',[3,7,10,14],1]],
    mv:[[-4,3],[4,3],[8,2],[3,1.5],[-3,1.5],[1,.6],[5,1]],hold:[8,13],glide:[2.2,4],stag:[.7,1.6],sus:.55},
  melancholy:{q:[['m9',[3,7,10,14],3],['m11',[3,10,14,17],2.5],['maj9',[4,7,11,14],1.5],['9sus4',[5,7,10,14],1.5],['m6/9',[3,9,14,7],1]],
    mv:[[-2,2],[5,2],[-5,2],[3,2],[-4,1.5],[1,.5],[-3,1]],hold:[7,12],glide:[1.8,3.6],stag:[.6,1.5],sus:.6}};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeEngine(o){
  const rnd=mulberry(parseInt(o.seed,16)||1),rr=(a,b)=>a+rnd()*(b-a),N=o.voices;let H=HARM[o.mood]||HARM.serene,pace=o.pace||1;
  const pickW=a=>{let t=a.reduce((s,x)=>s+x[x.length-1],0),r=rnd()*t;for(const x of a){r-=x[x.length-1];if(r<=0)return x;}return a[0];};
  const near=(m,pc)=>{const d=((pc-m)%12+12)%12;return d<=6?m+d:m+d-12;};
  const perms=n=>{const out=[];(function p(a,u){if(a.length===n){out.push(a.slice());return;}for(let i=0;i<n;i++)if(!u[i]){u[i]=1;a.push(i);p(a,u);a.pop();u[i]=0;}})([],[]);return out;};
  const PM={};const getP=n=>PM[n]||(PM[n]=perms(n));
  const subsets=(arr,k)=>{const out=[];(function s(i,a){if(a.length===k){out.push(a.slice());return;}for(let j=i;j<arr.length;j++){a.push(arr[j]);s(j+1,a);a.pop();}})(0,[]);return out;};
  let root=Math.floor(rnd()*12),qual=pickW(H.q);
  function voicing(rt,q,cur){let b=near(cur[0],rt);while(b<36)b+=12;while(b>50)b-=12;
    const tones=q[1].map(i=>(rt+i)%12),n=N-1;let pool=n>4?[...new Set([...tones,(rt+7)%12,rt,(rt+2)%12])].slice(0,n):tones;
    const cands=n<4?subsets(pool,n):[pool.slice(0,n)];let best=null,bc=1e9;
    for(const pcs of cands)for(const pm of getP(n)){const arr=[];let cost=0;
      for(let k=0;k<n;k++){let m=near(cur[k+1],pcs[pm[k]]);while(m<53)m+=12;while(m>84)m-=12;arr.push(m);}
      arr.sort((a,b)=>a-b);for(let k=0;k<n;k++)cost+=Math.abs(arr[k]-cur[k+1]);
      if(new Set(arr).size<n)cost+=60;for(let x=0;x<n;x++)for(let y=x+1;y<n;y++){const d=arr[y]-arr[x];if(d===1)cost+=9;else if(d===2)cost+=1.5;else if(d===11||d===13)cost+=3;}
      if(arr[0]-b<5)cost+=20;const span=arr[n-1]-arr[0];if(span>24)cost+=(span-24)*1.5;if(span<7)cost+=8;
      if(cost<bc){bc=cost;best=arr;}}
    return [b,...best];}
  /* opening chord */
  const seedCur=[43];for(let k=1;k<N;k++)seedCur.push(57+Math.round(k*16/N));
  let cur=voicing(root,qual,seedCur);const base=cur.slice();
  const segs=Array.from({length:N},()=>[]),chords=[{t:0,name:NOTE[root]+qual[0],arrive:0}];let T=rr(H.hold[0],H.hold[1])*.6;
  function plan(){let rt,q;do{rt=(root+pickW(H.mv)[0]+12)%12;q=pickW(H.q);}while(rt===root&&q===qual);root=rt;qual=q;
    const tgt=voicing(rt,q,cur),order=[...Array(N).keys()].sort(()=>rnd()-.5);
    const sus=new Set();if(rnd()<H.sus){const k=1+Math.floor(rnd()*(N-1));sus.add(k);if(rnd()<.3){const k2=1+Math.floor(rnd()*(N-1));sus.add(k2);}}
    let arrive=T;const susN={};const sg=[];
    order.forEach((v,k)=>{const st=T+k*rr(H.stag[0],H.stag[1])*pace,gd=rr(H.glide[0],H.glide[1])*pace,from=cur[v];let to=tgt[v];
      if(sus.has(v)){const lo=v>0?tgt[v-1]:-99,hi=v<N-1?tgt[v+1]:999;const opts=[1,2,-1,1,-2].map(d=>tgt[v]+d).filter(m=>m>lo&&m<hi&&m!==from);
        if(opts.length){to=opts[Math.floor(rnd()*opts.length)];susN[v]=to;}}
      if(to!==from)sg.push([v,{t0:st,t1:st+gd,m0:from,m1:to}]);arrive=Math.max(arrive,st+gd);});
    let fin=arrive;
    for(const v in susN){const rt0=arrive+rr(1.6,3.4)*pace,d=rr(1.2,2.2)*pace;sg.push([+v,{t0:rt0,t1:rt0+d,m0:susN[v],m1:tgt[v]}]);fin=Math.max(fin,rt0+d);}
    sg.sort((a,b)=>a[1].t0-b[1].t0).forEach(([v,s])=>{segs[v].push(s);o.onSeg&&o.onSeg(v,s);});
    chords.push({t:T,name:NOTE[rt]+q[0],arrive:fin,susp:Object.keys(susN).length>0});
    cur=tgt;T=fin+rr(H.hold[0],H.hold[1])*pace;}
  const ease=x=>.5-.5*Math.cos(Math.PI*x);
  function pitchAt(v,t){const S=segs[v];let lo=0,hi=S.length-1,i=-1;while(lo<=hi){const m=(lo+hi)>>1;if(S[m].t0<=t){i=m;lo=m+1;}else hi=m-1;}
    if(i<0)return base[v];const s=S[i];if(t>=s.t1)return s.m1;return s.m0+(s.m1-s.m0)*ease((t-s.t0)/(s.t1-s.t0));}
  function chordAt(t){let c=chords[0];for(let i=chords.length-1;i>=0;i--)if(chords[i].arrive<=t){c=chords[i];break;}const nx=chords.find(x=>x.t<=t&&x.arrive>t);return {name:c.name,moving:!!nx,next:nx&&nx.name};}
  function tensionAt(t){const ms=[];for(let v=0;v<N;v++)ms.push(pitchAt(v,t));let s=0;
    for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){const d=Math.abs(ms[a]-ms[b]),ic=d%12,dd=Math.min(ic,12-ic);
      const semi=Math.exp(-((ic-1)**2)/.18)+Math.exp(-((ic-11)**2)/.18)*(d>12?.45:.8),tri=Math.exp(-((ic-6)**2)/.18)*.3;s+=semi*(d<12?1:.4)+tri+(dd<.5&&d>0.3?.6:0);}
    return Math.min(1,s/1.2);}
  return {N,base,segs,chords,pitchAt,chordAt,tensionAt,ensure(t){while(T<t)plan();},setPace(p){pace=p;},setMood(m){H=HARM[m]||H;}};}
const mtof=m=>440*2**((m-69)/12);
/* schedule one glide on an oscillator's frequency param */
function glideParam(param,s,t0){const n=48,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1),e=.5-.5*Math.cos(Math.PI*x);c[i]=mtof(s.m0+(s.m1-s.m0)*e);}
  try{param.setValueCurveAtTime(c,t0+s.t0,s.t1-s.t0);}catch(e){try{param.setValueAtTime(mtof(s.m1),t0+s.t1);}catch(_){}}}
function newSeed(){return Math.floor(Math.random()*0xffffffff).toString(16).toUpperCase().padStart(8,'0');}
/* ===== end engine ===== */

const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const R=Math.random,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),TAU=Math.PI*2;
const MAPS={
  inferno:{harm:'serene',bg:'#05030a',ink:'#ffd9a8',dim:'rgba(255,217,168,.55)',bar:'rgba(10,6,18,.88)',line:'rgba(255,217,168,.28)',
    stops:[[0,'#05030a'],[.18,'#1d0b3f'],[.38,'#6a1b6b'],[.58,'#c7354f'],[.76,'#f6812b'],[.9,'#fbd35a'],[1,'#fffbe8']],fill:'rgba(199,53,79,.28)'},
  ice:{harm:'dream',bg:'#02060d',ink:'#cfeaff',dim:'rgba(207,234,255,.55)',bar:'rgba(3,10,20,.88)',line:'rgba(207,234,255,.28)',
    stops:[[0,'#02060d'],[.2,'#071d3d'],[.42,'#16508f'],[.62,'#2f9bd6'],[.8,'#8fdcff'],[1,'#ffffff']],fill:'rgba(47,155,214,.25)'},
  paper:{gam:1.05,harm:'melancholy',bg:'#f1ede3',ink:'#22201c',dim:'rgba(34,32,28,.6)',bar:'rgba(241,237,227,.93)',line:'rgba(34,32,28,.25)',
    stops:[[0,'#f1ede3'],[.25,'#d9d3c5'],[.5,'#958e80'],[.75,'#45403a'],[1,'#0d0c0b']],fill:'rgba(34,32,28,.12)'}};
const TARGETS=[['PSR J0437−4715','04h37m15s','−47°15′09″'],['M31 · HI HALO','00h42m44s','+41°16′09″'],['SGR A*','17h45m40s','−29°00′28″'],['3C 273','12h29m06s','+02°03′09″'],
  ['CAS A','23h23m24s','+58°48′54″'],['CRAB PULSAR','05h34m31s','+22°00′52″'],['VELA PULSAR','08h35m20s','−45°10′35″'],['CYGNUS A','19h59m28s','+40°44′02″'],['W3(OH)','02h27m04s','+61°52′25″']];
let map='inferno',N=5,pace=1,seed=newSeed();
try{const s=JSON.parse(localStorage.getItem('dfr-prefs')||'{}');if([4,5,6].includes(s.N))N=s.N;if([.65,1,1.5].includes(s.pace))pace=s.pace;}catch(e){}
const save=()=>{try{localStorage.setItem('dfr-prefs',JSON.stringify({map,N,pace}));}catch(e){}};
let LUT=null;
function buildLUT(){const st=MAPS[map].stops.map(([p,h])=>[p,parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);LUT=new Uint8ClampedArray(256*3);
  for(let i=0;i<256;i++){const v=i/255;let k=0;while(k<st.length-2&&v>st[k+1][0])k++;const a=st[k],b=st[k+1],u=clamp((v-a[0])/(b[0]-a[0]),0,1);for(let c=0;c<3;c++)LUT[i*3+c]=a[c+1]+(b[c+1]-a[c+1])*u;}}

/* ---------- layout ---------- */
let W=0,H=0,DPR=1,f=12,hdr=0,specTop=0,specH=0,axisH=0,wfTop=0,wfH=0,wf=null,wk=null,rowImg=null,spec=null;
const FLO=55,FHI=3520,xOf=hz=>W*(.04+.92*clamp(Math.log2(hz/FLO)/Math.log2(FHI/FLO),0,1));
function layout(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  f=clamp(Math.min(W,H)*.016,10,13);hdr=f*3;specTop=hdr+f*.6;specH=Math.round(H*(H>W?.17:.22));axisH=f*2.2;wfTop=Math.round(specTop+specH+axisH);wfH=H-wfTop;
  const old=wf;wf=document.createElement('canvas');wf.width=Math.max(1,Math.round(W));wf.height=Math.max(1,Math.round(wfH));wk=wf.getContext('2d');wk.fillStyle=MAPS[map].bg;wk.fillRect(0,0,wf.width,wf.height);
  if(old)wk.drawImage(old,0,0,wf.width,wf.height);rowImg=wk.createImageData(wf.width,1);spec=new Float32Array(wf.width);events.forEach(e=>e.y=Math.min(e.y,wfH));}

/* ---------- sound ---------- */
let A=null,master,bus,eng=null,synth=[],startAt=0,noiseG=null,pulse=null;
function initAudio(){A=new (window.AudioContext||window.webkitAudioContext)();master=A.createGain();master.gain.value=+$('vol').value*.85;
  const comp=A.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;master.connect(comp).connect(A.destination);
  const rev=A.createConvolver(),len=A.sampleRate*5,b=A.createBuffer(2,len,A.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*(1-i/len)**2.8;}
  rev.buffer=b;const wet=A.createGain();wet.gain.value=.7;rev.connect(wet).connect(master);const dry=A.createGain();dry.gain.value=.6;dry.connect(master);bus=A.createGain();bus.connect(dry);bus.connect(rev);
  const nb=A.createBuffer(1,A.sampleRate*3,A.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;const ns=A.createBufferSource();ns.buffer=nb;ns.loop=true;
  const hp=A.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;noiseG=A.createGain();noiseG.gain.value=.003;ns.connect(hp).connect(lp).connect(noiseG).connect(bus);ns.start();}
function makeSynth(){synth.forEach(s=>s.kill());synth=[];const P=.714;
  for(let v=0;v<N;v++){const fr=mtof(eng.base[v]),bass=v===0,t=A.currentTime,g=A.createGain(),pan=A.createStereoPanner(),amp=A.createGain();
    pan.pan.value=N>1?-.5+v/(N-1):0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(bass?.1:.06,t+3);
    const car=A.createOscillator();car.type='sine';car.frequency.value=fr;
    const mod=A.createOscillator(),mi=A.createGain();mod.type='sine';mod.frequency.value=fr*2;mi.gain.value=fr*.35;mod.connect(mi).connect(car.frequency);
    const h3=A.createOscillator(),h3g=A.createGain();h3.frequency.value=fr*3;h3g.gain.value=bass?.04:.07;h3.connect(h3g).connect(amp);
    car.connect(amp);
    /* each signal pulses gently, like a pulsar, at its own fraction of the base period */
    const lfo=A.createOscillator(),lg=A.createGain();lfo.frequency.value=1/(P*(1+v*.5));lg.gain.value=bass?.06:.16;lfo.connect(lg).connect(amp.gain);amp.gain.value=1-lg.gain.value;
    amp.connect(g).connect(pan).connect(bus);[car,mod,h3,lfo].forEach(o=>o.start(t));
    synth.push({os:[{o:car,mul:1},{o:mod,mul:2},{o:h3,mul:3}],mi,kill(){const t=A.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.setTargetAtTime(0,t,.5);[car,mod,h3,lfo].forEach(o=>o.stop(t+4));}});}}
function onSeg(v,s){const sy=synth[v];if(!sy)return;sy.os.forEach(x=>glideParam(x.o.frequency,{t0:s.t0,t1:s.t1,m0:s.m0+12*Math.log2(x.mul),m1:s.m1+12*Math.log2(x.mul)},startAt));}

/* ---------- reception ---------- */
let lastT=0,acc=0,events=[],lastTick=-1,lastChord=0,target=0,slewT=-99,playing=false,started=false,peaks=[];
function begin(){eng=makeEngine({seed,voices:N,mood:MAPS[map].harm,pace,onSeg});makeSynth();startAt=A.currentTime+.25;eng.ensure(16);lastT=0;acc=0;events=[];lastTick=-1;lastChord=0;
  target=parseInt(seed.slice(0,2),16)%TARGETS.length;slewT=0;if(wk){wk.fillStyle=MAPS[map].bg;wk.fillRect(0,0,wf.width,wf.height);}}
const speed=()=>wfH/24/pace;
function rowAt(t){const w=wf.width,ten=eng.tensionAt(t),slew=clamp(1-(t-slewT)/2.5,0,1),row=new Float32Array(w);
  for(let x=0;x<w;x++){const r=R();row[x]=.012+r*r*r*r*r*(.24+ten*.32)+(ten>.4?R()*R()*ten*.16:0)+slew*R()*.5;}
  const ps=[];for(let v=0;v<N;v++){const m=eng.pitchAt(v,t),hz=mtof(m),a=(v===0?1:.86)*(.9+.1*Math.sin(t*(3+v)));ps.push(m);
    [[1,1],[2,.42],[3,.24],[4,.12]].forEach(([h,ha])=>{const x=xOf(hz*h);if(x>=w)return;const sg=h===1?1.5:1.8,amp=a*ha;for(let d=-6;d<=6;d++){const xi=Math.round(x)+d;if(xi<0||xi>=w)continue;row[xi]+=amp*Math.exp(-((xi-x)**2)/(2*sg*sg));}});}
  /* interference smear between signals that clash */
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){const d=Math.abs(ps[a]-ps[b]);if(d<1.4&&d>.05){const x1=xOf(mtof(Math.min(ps[a],ps[b]))),x2=xOf(mtof(Math.max(ps[a],ps[b])));const k=(1.4-d)*.45*(.5+.5*Math.sin(t*TAU*(d*3+.5)));
    for(let x=Math.floor(x1)-3;x<=x2+3;x++)if(x>=0&&x<w)row[x]+=k*R();}}
  return row;}
function scroll(t){const dt=t-lastT;lastT=t;acc+=dt*speed();const rows=Math.floor(acc);if(rows<1)return;acc-=rows;const w=wf.width;
  wk.globalCompositeOperation='copy';wk.drawImage(wf,0,rows);wk.globalCompositeOperation='source-over';
  for(let r=0;r<rows;r++){const row=rowAt(t-r/speed()),d=rowImg.data,gam=MAPS[map].gam||.5;for(let x=0;x<w;x++){const i=clamp(Math.round(clamp(row[x],0,1)**gam*255),0,255)*3,j=x*4;d[j]=LUT[i];d[j+1]=LUT[i+1];d[j+2]=LUT[i+2];d[j+3]=255;}
    wk.putImageData(rowImg,0,r);if(r===0)for(let x=0;x<w;x++)spec[x]=spec[x]*.6+row[x]*.4;}
  events.forEach(e=>e.y+=rows);events=events.filter(e=>e.y<wfH+20);
  const tk=Math.floor(t/5);if(tk!==lastTick){lastTick=tk;events.push({k:'tick',y:0,s:tk*5});}
  const ch=eng.chords;while(lastChord<ch.length&&ch[lastChord].arrive<=t){const c=ch[lastChord];if(lastChord>0){events.push({k:'chord',y:0,name:c.name,susp:c.susp});if(lastChord%4===0){target=(target+1)%TARGETS.length;slewT=t;}}lastChord++;}}

/* ---------- drawing ---------- */
const fmtT=s=>{s=Math.floor(s);return [s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');};
const msg=$('msg');let errs=0;function report(e){errs++;console.error(e);if(errs<4){msg.textContent='Something went wrong: '+(e&&e.message||e);msg.hidden=false;}}
function loop(){requestAnimationFrame(loop);try{draw();}catch(e){report(e);}}
function draw(){const c=MAPS[map],t=A&&eng?Math.max(0,A.currentTime-startAt):0,m=Math.max(12,W*.022);
  if(eng&&t>lastT){eng.ensure(t+16);if(noiseG)noiseG.gain.setTargetAtTime(.002+eng.tensionAt(t)*.02,A.currentTime,.3);scroll(t);}
  ctx.fillStyle=c.bg;ctx.fillRect(0,0,W,H);
  if(wf){ctx.imageSmoothingEnabled=false;ctx.drawImage(wf,0,wfTop,W,wfH);ctx.imageSmoothingEnabled=true;}
  /* header */
  ctx.fillStyle=c.ink;ctx.textBaseline='middle';const hy=hdr/2+2,tg=TARGETS[target];
  ctx.font=`600 ${f*1.05}px "Martian Mono", monospace`;ctx.textAlign='left';ctx.fillText('DEEP FIELD RECEIVER',m,hy);
  ctx.font=`400 ${f*.9}px "Martian Mono", monospace`;ctx.textAlign='right';ctx.globalAlpha=.85;
  const slewing=eng&&t-slewT<2.5;ctx.fillText(W>700?`${slewing?'SLEWING → ':'TRACKING  '}${tg[0]}   RA ${tg[1]}  DEC ${tg[2]}`:`${slewing?'SLEW → ':''}${tg[0]}`,W-m,hy);ctx.globalAlpha=1;
  ctx.strokeStyle=c.line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,hdr+.5);ctx.lineTo(W,hdr+.5);ctx.stroke();
  /* spectrum */
  const sb=specTop+specH;ctx.strokeStyle=c.line;ctx.setLineDash([2,4]);for(let k=1;k<4;k++){const y=specTop+specH*k/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.setLineDash([]);
  if(spec){const w=spec.length,yv=v=>sb-clamp(Math.sqrt(Math.max(0,v)),0,1.15)*specH*.85;ctx.beginPath();ctx.moveTo(0,sb);for(let x=0;x<w;x+=1)ctx.lineTo(x*W/w,yv(spec[x]));ctx.lineTo(W,sb);ctx.closePath();
    ctx.fillStyle=c.fill;ctx.fill();ctx.beginPath();for(let x=0;x<w;x++){const y=yv(spec[x]);x?ctx.lineTo(x*W/w,y):ctx.moveTo(0,y);}ctx.strokeStyle=c.ink;ctx.lineWidth=1;ctx.stroke();}
  /* axis */
  ctx.strokeStyle=c.ink;ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(0,sb+.5);ctx.lineTo(W,sb+.5);ctx.stroke();ctx.globalAlpha=1;
  ctx.font=`400 ${f*.78}px "Martian Mono", monospace`;ctx.textAlign='center';ctx.fillStyle=c.dim;
  for(let hz=FLO;hz<=FHI;hz*=2){const x=xOf(hz);ctx.fillRect(x,sb,1,5);ctx.fillText(hz>=1000?(hz/1000).toFixed(hz%1000?2:0)+'k':String(hz),x,sb+f*1.15);}
  /* signal markers on the spectrum */
  if(eng){ctx.font=`400 ${f*.82}px "Martian Mono", monospace`;const lab=[];for(let v=0;v<N;v++){const hz=mtof(eng.pitchAt(v,t)),x=xOf(hz);lab.push([x,hz,v]);}lab.sort((a,b)=>a[0]-b[0]);
    let lastX=-1e9,row=0;lab.forEach(([x,hz,v])=>{row=x-lastX<f*6.5?row+1:0;lastX=x;const y=specTop+f*(1+row*1.25);ctx.fillStyle=c.ink;ctx.textAlign='center';ctx.fillText(`${hz.toFixed(1)}`,x,y);
      ctx.globalAlpha=.5;ctx.fillRect(x-.5,y+f*.55,1,Math.max(0,sb-y-f*.55-2));ctx.globalAlpha=1;});}
  /* waterfall annotations: time ticks on the left, chord arrivals on the right */
  ctx.font=`400 ${f*.78}px "Martian Mono", monospace`;ctx.textBaseline='middle';
  for(const e of events){const y=wfTop+e.y;if(e.k==='tick'){ctx.fillStyle=c.ink;ctx.globalAlpha=.55;ctx.fillRect(0,y,8,1);ctx.textAlign='left';const lb=`−${String(Math.round(t-e.s)).padStart(2,'0')}s`;ctx.globalAlpha=.7;ctx.fillStyle=c.bg;ctx.fillRect(9,y-f*.6,ctx.measureText(lb).width+6,f*1.2);ctx.globalAlpha=.85;ctx.fillStyle=c.ink;ctx.fillText(lb,12,y);}
    else{ctx.globalAlpha=.6;ctx.strokeStyle=c.ink;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(W*.55,y+.5);ctx.lineTo(W-m*.5,y+.5);ctx.stroke();ctx.setLineDash([]);const lb=(e.susp?'RESOLVED · ':'LOCK · ')+e.name,lw=ctx.measureText(lb).width;ctx.globalAlpha=.72;ctx.fillStyle=c.bg;ctx.fillRect(W-m*.5-lw-5,y-f*1.4,lw+10,f*1.3);ctx.globalAlpha=1;ctx.fillStyle=c.ink;ctx.textAlign='right';ctx.fillText(lb,W-m*.5,y-f*.75);}}
  ctx.globalAlpha=1;
  /* readouts over the lower waterfall */
  const g=ctx.createLinearGradient(0,H-f*9,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,map==='paper'?'rgba(241,237,227,.92)':'rgba(0,0,0,.75)');ctx.fillStyle=g;ctx.fillRect(0,H-f*9,W,f*9);
  if(eng){const ch=eng.chordAt(t),ten=eng.tensionAt(t);let sum=0;for(let v=0;v<N;v++)sum+=mtof(eng.pitchAt(v,t));const snr=(8+(1-ten)*26+Math.sin(t*.7)*.8).toFixed(1),by=H-m-(H>W?f*6.5:f*4.2);
    ctx.fillStyle=c.ink;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font=`400 ${f*.92}px "Martian Mono", monospace`;
    ctx.fillText(`INTEGRATION ${fmtT(t)}`,m,by);ctx.fillText(`SNR ${snr} dB   ${N} SIGNALS`,m,by+f*1.6);ctx.globalAlpha=.7;ctx.fillText(`Σf ${sum.toFixed(1)} Hz`,m,by+f*3.2);ctx.globalAlpha=1;
    ctx.textAlign='right';ctx.font=`300 ${f*2.2}px "Martian Mono", monospace`;ctx.fillText(ch.moving?'→ '+ch.next:ch.name,W-m,by+f*.4);
    ctx.font=`400 ${f*.92}px "Martian Mono", monospace`;ctx.globalAlpha=.7;ctx.fillText(`SEED ${seed}`,W-m,by+f*2.2);ctx.globalAlpha=1;}}

/* ---------- controls ---------- */
const ico=$('ico'),PAUSE='<rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/>',PLAY='<path d="M5 3l12 7-12 7z"/>';
function setPlaying(on){playing=on;ico.innerHTML=on?PAUSE:PLAY;$('play').setAttribute('aria-label',on?'Pause':'Play');if(A){on?A.resume().catch(()=>{}):A.suspend().catch(()=>{});}poke();}
const press=(sel,el)=>document.querySelectorAll(sel+' button').forEach(b=>b.setAttribute('aria-pressed',b===el));
const mkSeed=newSeed;function restart(fresh){if(fresh)seed=mkSeed();if(A&&started){begin();if(!playing)setPlaying(true);}}
function applyMap(){const c=MAPS[map],r=document.documentElement.style;r.setProperty('--ink',c.ink);r.setProperty('--bg',c.bg);r.setProperty('--bar',c.bar);r.setProperty('--line',c.line);buildLUT();}
$('play').addEventListener('click',()=>{if(started)setPlaying(!playing);});
$('fresh').addEventListener('click',()=>restart(true));
document.querySelectorAll('#moods button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.m===map);b.addEventListener('click',()=>{map=b.dataset.m;press('#moods',b);save();applyMap();if(eng)eng.setMood(MAPS[map].harm);});});
document.querySelectorAll('#count button').forEach(b=>{b.setAttribute('aria-pressed',+b.dataset.n===N);b.addEventListener('click',()=>{N=+b.dataset.n;press('#count',b);save();restart(false);});});
document.querySelectorAll('#pace button').forEach(b=>{b.setAttribute('aria-pressed',+b.dataset.p===pace);b.addEventListener('click',()=>{pace=+b.dataset.p;press('#pace',b);save();if(eng)eng.setPace(pace);});});
$('vol').addEventListener('input',()=>{if(A)master.gain.setTargetAtTime(+$('vol').value*.85,A.currentTime,.1);});
$('go').addEventListener('click',()=>{try{initAudio();A.resume();begin();}catch(e){report(e);}$('start').classList.add('gone');started=true;setPlaying(true);});
addEventListener('keydown',e=>{if(e.code==='Space'&&started&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing);}});
let idleT=0;function poke(){document.body.classList.remove('idle');clearTimeout(idleT);if(playing)idleT=setTimeout(()=>document.body.classList.add('idle'),3500);}
['pointermove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,poke));
addEventListener('error',e=>report(e.error||e.message));
applyMap();let rz=0;const ro=new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(layout,100);});ro.observe(document.body);layout();
requestAnimationFrame(loop);
}
</script>
