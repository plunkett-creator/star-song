<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Star Song: night-sky pieces that play themselves</title>
<meta name="description" content="Star Song is a collection of generative music pieces drawn from the night sky: comets, constellations, star trails and satellites that play chords as they move.">
<meta property="og:title" content="Star Song">
<meta property="og:description" content="Night-sky pieces that play themselves. Try Wandering Stars free.">
<meta property="og:image" content="pieces/wandering-stars/thumb.jpg">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="pieces.js"></script>
<style>
/* layout: a title cartouche, the bundle panel, then a grid of square cards (one per piece), privacy and restore at the foot */
:root{--night:#0a1533;--night-2:#060d22;--gold:#e3c170;--gold-dim:rgba(227,193,112,.62);--text:#f3ead2;
  --display:"Cinzel","Times New Roman",serif;--body:"Cormorant Garamond",Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#12265a 0%,#0b183b 45%,#050b1d 100%) fixed var(--night-2);color:var(--text);font-family:var(--body);font-size:18px;
  padding:calc(30px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html.in-app body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{text-align:center;margin:0 auto 22px;max-width:640px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,46px);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0;padding-left:.24em}
header p{margin:6px 0 0;font-style:italic;color:var(--gold-dim);font-size:20px}
.rule{width:140px;height:1px;background:var(--gold-dim);margin:16px auto 0;position:relative}
.rule::after{content:"\2726";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:#0e1d47;color:var(--gold);padding:0 8px;font-size:12px}
.panel{max-width:760px;margin:0 auto 28px;border:1px solid var(--gold-dim);background:rgba(6,13,34,.6);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.panel h2{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 3px;color:var(--gold)}
.panel p{margin:0;font-style:italic;color:var(--text);line-height:1.3}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px}
.panel[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,300px));justify-content:center;gap:22px;max-width:1300px;margin:0 auto}
.card{background:rgba(6,13,34,.72);border:1px solid var(--gold-dim);border-radius:2px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;display:block;width:100%;aspect-ratio:1;background:#0b183b;border:0;padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .lock{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(6,13,34,.8);border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
h3{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.13em;text-transform:uppercase;margin:0;color:var(--text)}
.blurb{margin:0;font-style:italic;color:var(--gold-dim);line-height:1.3;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.tag{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim)}
button,a.btn{font:500 17px/1 var(--body);color:var(--text);background:transparent;border:1px solid var(--gold-dim);border-radius:2px;padding:11px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none}
button:active,a.btn:active{border-color:var(--gold)}
@media (hover:hover){button:hover,a.btn:hover{border-color:var(--gold);color:var(--gold)}}
button.primary,a.btn.primary{background:var(--gold);color:var(--night-2);border-color:var(--gold)}
@media (hover:hover){button.primary:hover,a.btn.primary:hover{color:var(--night-2);filter:brightness(1.08)}}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{text-align:center;margin:34px auto 0;color:var(--gold-dim);font-style:italic}
footer a{color:var(--gold-dim)}
.msg{min-height:1.4em;margin:0 0 12px;color:var(--gold)}
.foot-acts{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1 id="title">Star Song</h1><p id="sub"></p><div class="rule"></div></header>

<section class="panel" id="buyPanel" hidden>
  <div><h2 id="buyTitle">The whole collection</h2><p id="buyText"></p></div>
  <div class="acts"><button type="button" class="primary" id="buy">Unlock all</button></div>
</section>

<section class="panel" id="webPanel" hidden>
  <div><h2>Get the app</h2><p id="webText"></p></div>
  <div class="acts" id="webLinks"></div>
</section>

<main class="grid" id="grid"></main>

<footer>
  <p class="msg" id="msg" role="status"></p>
  <div class="foot-acts">
    <button type="button" id="restore" hidden>Restore purchases</button>
    <a href="privacy.html" id="privacy">Privacy</a>
  </div>
</footer>

<script>
(()=>{'use strict';
const P=window.PIECES||[],C=window.COLLECTION||{},$=s=>document.querySelector(s);
const ios=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.store);
const android=!!window.StarSongAndroid, app=ios||android;
document.documentElement.classList.add(app?'in-app':'on-web');
const BUNDLE=C.bundleProductId, paidCount=P.filter(p=>!p.free).length;
let price='',owned=new Set(),busy=false;

/* ---- talking to the app's store ---- */
function store(action,arg){
  try{
    if(ios){window.webkit.messageHandlers.store.postMessage(action==='products'?{action,ids:arg}:action==='buy'?{action,id:arg}:{action});return true;}
    if(android){const A=window.StarSongAndroid;if(action==='products')A.products(JSON.stringify(arg));else if(action==='buy')A.buy(arg);else A.restore();return true;}
  }catch(e){}
  return false;
}
/* called by the app whenever prices or purchases change */
window.__storeUpdate=u=>{
  if(u.prices&&u.prices[BUNDLE])price=u.prices[BUNDLE];
  if(u.owned)owned=new Set(u.owned);
  busy=false;if(u.message)say(u.message);render();
};
const hasAll=()=>owned.has(BUNDLE);
const unlocked=p=>p.free||hasAll();
function say(t){$('#msg').textContent=t||'';}
function buy(){if(busy)return;if(!price){say('The collection’s price is still loading. Please check your connection and try again.');store('products',[BUNDLE]);return;}busy=true;say('');render();store('buy',BUNDLE);}
function open(p,taste){location.href='pieces/'+p.id+'/index.html';}

const LOCK='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#e3c170" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';

function render(){
  $('#title').textContent=C.title||'';$('#sub').textContent=C.subtitle||'';
  /* the bundle panel (apps) or the get-the-app panel (website) */
  if(app){
    $('#restore').hidden=false;
    const bp=$('#buyPanel');bp.hidden=false;
    if(hasAll()){
      $('#buyTitle').textContent='Thank you';$('#buyText').textContent='The whole collection is yours, on every device signed in with this account.';$('#buy').hidden=true;
    }else{
      $('#buyTitle').textContent=C.bundleName||'The whole collection';
      $('#buyText').textContent='Wandering Stars is free. Unlock the other '+paidCount+' pieces, and any added later, with one purchase.';
      const b=$('#buy');b.hidden=false;b.disabled=busy;b.textContent=busy?'Buying…':price?'Unlock all · '+price:'Unlock all';b.onclick=buy;
    }
  }else{
    $('#webPanel').hidden=false;
    const links=$('#webLinks');links.textContent='';
    const add=(url,label)=>{if(!url)return;const a=document.createElement('a');a.className='btn primary';a.href=url;a.target='_blank';a.rel='noopener';a.textContent=label;links.appendChild(a);};
    add(C.appStoreUrl,'App Store');add(C.playStoreUrl,'Google Play');
    $('#webText').textContent=(links.children.length?'':'Coming soon to iPhone, iPad and Android. ')+
      'Play Wandering Stars free here, and try a one-minute taste of the other '+paidCount+'. In the app they play for as long as you like.';
  }
  /* the cards */
  const g=$('#grid');g.textContent='';
  for(const p of P){
    const card=document.createElement('article');card.className='card';
    const th=document.createElement('button');th.className='thumb';th.type='button';th.setAttribute('aria-label',p.title);
    const img=document.createElement('img');img.src='pieces/'+p.id+'/thumb.jpg';img.alt='';img.loading='lazy';th.appendChild(img);
    const body=document.createElement('div');body.className='body';
    const h=document.createElement('h3');h.textContent=p.title;
    const bl=document.createElement('p');bl.className='blurb';bl.textContent=p.blurb||'';
    const row=document.createElement('div');row.className='row';
    const tag=document.createElement('span');tag.className='tag';
    const btn=document.createElement('button');btn.type='button';
    if(app){
      if(unlocked(p)){tag.textContent=p.free?'Free':'Yours';btn.textContent='Open';btn.className='primary';btn.onclick=th.onclick=()=>open(p);}
      else{
        tag.textContent='In the collection';btn.textContent=price?'Unlock · '+price:'Unlock';btn.disabled=busy;
        const lk=document.createElement('span');lk.className='lock';lk.innerHTML=LOCK;th.appendChild(lk);
        btn.onclick=th.onclick=buy;
      }
    }else{
      if(p.free){tag.textContent='Free';btn.textContent='Play';btn.className='primary';}
      else{tag.textContent='In the app';btn.textContent='Try 1 minute';}
      btn.onclick=th.onclick=()=>open(p);
    }
    row.append(tag,btn);body.append(h,bl,row);card.append(th,body);g.appendChild(card);
  }
}
$('#restore').onclick=()=>{say('Checking your purchases…');store('restore');};
if(app)$('#privacy').hidden=true;
render();
if(app)store('products',[BUNDLE]);
})();
</script>
</body>
</html>
