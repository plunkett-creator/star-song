# Builds Star Song for iPhone and iPad on one of GitHub's Macs and uploads it to App Store Connect.
# Run it from the Actions tab: "iPhone app - build and upload to App Store Connect" > Run workflow.
# It needs the secrets and the BUNDLE_ID variable described in SETUP-GUIDE.md.
name: iPhone app - build and upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the settings are in place
        run: |
          missing=""
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || missing="$missing ASC_KEY_ID"
          [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          [ -n "$CERTIFICATE_PRIVATE_KEY" ] || missing="$missing CERTIFICATE_PRIVATE_KEY"
          [ -n "$BUNDLE_ID" ] || missing="$missing BUNDLE_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing on GitHub:$missing (see SETUP-GUIDE.md, Part B step 8)"; exit 1; fi
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install xcodegen
          pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Make the Xcode project
        run: |
          # Your bundle ID, and a build number that goes up by one each run
          cd ios
          sed -i '' "s/com.example.starsong/${BUNDLE_ID}/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate

      - name: Get the signing certificate and profile from Apple
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/StarSong.xcodeproj

      - name: Build the app
        run: |
          xcode-project build-ipa --project ios/StarSong.xcodeproj --scheme StarSong

      - name: Upload to App Store Connect
        run: |
          app-store-connect publish --path "build/ios/ipa/*.ipa"

      - name: Keep a copy of the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarSong-ios-build-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore

      - name: Tidy up the keychain
        if: always()
        run: keychain use-login || true
